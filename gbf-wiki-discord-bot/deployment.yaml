apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: gbf-wiki-discord-bot-secrets
spec:
  itemPath: "vaults/sphiria/items/gbf-wiki-discord-bot"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gbf-wiki-discord-bot-config
data:
  DRY_RUN: "false"
  ALLOWED_ROLES: "Wiki Editor,Wiki Admin,Wiki Discord Moderator,Verified Editor"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gbf-wiki-discord-bot
  labels:
    app: gbf-wiki-discord-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gbf-wiki-discord-bot
  template:
    metadata:
      labels:
        app: gbf-wiki-discord-bot
    spec:
      containers:
      - name: gbf-wiki-discord-bot
        image: ghcr.io/sphiria/gbf-wiki-image-uploader-discord-bot:sha-f908a16
        imagePullPolicy: Always
        
        envFrom:
        - configMapRef:
            name: gbf-wiki-discord-bot-config
        env:
        - name: DISCORD_TOKEN
          valueFrom:
            secretKeyRef:
              name: gbf-wiki-discord-bot-secrets
              key: DISCORD_TOKEN
        - name: GUILD_ID
          valueFrom:
            secretKeyRef:
              name: gbf-wiki-discord-bot-secrets
              key: GUILD_ID
        - name: PROXY_URL
          valueFrom:
            secretKeyRef:
              name: gbf-wiki-discord-bot-secrets
              key: PROXY_URL
        - name: USER_AGENT
          valueFrom:
            secretKeyRef:
              name: gbf-wiki-discord-bot-secrets
              key: USER_AGENT
        - name: WIKI_PASSWORD
          valueFrom:
            secretKeyRef:
              name: gbf-wiki-discord-bot-secrets
              key: WIKI_PASSWORD
        - name: WIKI_USERNAME
          valueFrom:
            secretKeyRef:
              name: gbf-wiki-discord-bot-secrets
              key: WIKI_USERNAME
        - name: R2_ENDPOINT_URL
          valueFrom:
            secretKeyRef:
              name: gbf-wiki-discord-bot-secrets
              key: R2_ENDPOINT_URL
        - name: R2_BUCKET
          valueFrom:
            secretKeyRef:
              name: gbf-wiki-discord-bot-secrets
              key: R2_BUCKET
        - name: R2_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: gbf-wiki-discord-bot-secrets
              key: R2_API_TOKEN
        
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - "import sys; sys.exit(0)"
          initialDelaySeconds: 30
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 3
        
        readinessProbe:
          exec:
            command:
            - python
            - -c
            - "import sys; sys.exit(0)"
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
      
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      
      restartPolicy: Always
