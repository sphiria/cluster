apiVersion: v1
kind: Service
metadata:
  name: valkey-service
spec:
  type: ClusterIP
  selector:
    app: valkey
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: valkey-config
data:
  valkey.conf: |
    maxmemory 4gb
    maxmemory-policy volatile-lru
    save 900 1
    save 300 10
    save 60 10000
    dir /data
    dbfilename dump.rdb
    loglevel notice
    tcp-backlog 511
    timeout 0
    tcp-keepalive 300
    slowlog-log-slower-than 10000
    slowlog-max-len 128
    aclfile /etc/valkey-acl/users.acl
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  labels:
    app: valkey
spec:
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: valkey
  replicas: 1
  template:
    metadata:
      labels:
        app: valkey
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: render-acl
        image: valkey/valkey:9.0.6-alpine
        command:
        - sh
        - -ec
        - |
          mediawiki_hash="$(printf '%s' "$MEDIAWIKI_PASSWORD" | sha256sum)"
          mediawiki_hash="${mediawiki_hash%% *}"
          exporter_hash="$(printf '%s' "$EXPORTER_PASSWORD" | sha256sum)"
          exporter_hash="${exporter_hash%% *}"
          printf '%s\n' \
            'user default on nopass ~* &* +@all' \
            "user mediawiki on #${mediawiki_hash} ~* &* +@all -@admin -@dangerous +eval +evalsha +script|load +script|exists" \
            "user exporter on #${exporter_hash} ~* &* +@all -@write -@admin -@dangerous +config|get +client|setname +client|list +info +slowlog|get +slowlog|len +latency|latest +latency|history +memory|stats +memory|usage +scan +type +strlen +llen +scard +zcard +hlen +xlen +pfcount +eval" \
            > /acl/users.acl
          chmod 0400 /acl/users.acl
        env:
        - name: MEDIAWIKI_PASSWORD
          valueFrom:
            secretKeyRef:
              name: valkey-secrets
              key: mediawiki_password
        - name: EXPORTER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: valkey-secrets
              key: exporter_password
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: acl
          mountPath: /acl
      containers:
      - name: valkey
        image: valkey/valkey:9.0.6-alpine
        args: ["valkey-server", "/usr/local/etc/valkey/valkey.conf"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 6379
          name: valkey
        volumeMounts:
        - name: config
          mountPath: /usr/local/etc/valkey/
          readOnly: true
        - name: data
          mountPath: /data
        - name: acl
          mountPath: /etc/valkey-acl
          readOnly: true
        resources:
          limits:
            memory: "5Gi"
            cpu: "2000m"
          requests:
            memory: "2Gi"
            cpu: "100m"
        startupProbe:
          exec:
            command:
            - valkey-cli
            - ping
          periodSeconds: 5
          failureThreshold: 60
        livenessProbe:
          exec:
            command:
            - valkey-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - valkey-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: valkey-config
      - name: data
        persistentVolumeClaim:
          claimName: valkey-data
      - name: acl
        emptyDir:
          medium: Memory
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valkey
spec:
  podSelector:
    matchLabels:
      app: valkey
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - nier
          - nier-jobrunner
          - nier-search-suggester
          - nier-jobchron
          - ilsa
          - ilsa-jobrunner
          - valkey-exporter
    ports:
    - protocol: TCP
      port: 6379
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: valkey-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey-exporter
  labels:
    app: valkey-exporter
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: valkey-exporter
  template:
    metadata:
      labels:
        app: valkey-exporter
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: redis-exporter
        image: oliver006/redis_exporter:v1.95.0-alpine
        securityContext:
          runAsNonRoot: true
          runAsUser: 59000
          runAsGroup: 59000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 9121
          name: metrics
        env:
        - name: REDIS_ADDR
          value: "valkey-service:6379"
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /metrics
            port: 9121
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /metrics
            port: 9121
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: valkey-exporter
  labels:
    app: valkey-exporter
spec:
  type: ClusterIP
  ports:
  - port: 9121
    targetPort: 9121
    protocol: TCP
    name: metrics
  selector:
    app: valkey-exporter
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: valkey-exporter
  labels:
    app: valkey-exporter
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: valkey-exporter
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
