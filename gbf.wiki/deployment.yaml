apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: nier-secrets
spec:
  itemPath: "vaults/sphiria/items/gbfwikilegacy"
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nier-assets-volume
spec:
  capacity:
    storage: 100Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: "/srv/nier-assets"
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - sphiria
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nier-assets-volume-claim
spec:
  volumeName: nier-assets-volume
  storageClassName: local-storage
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nier
  labels:
    app: mediawiki
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: nier
  replicas: 1
  template:
    metadata:
      labels:
        app: nier
    spec:
      imagePullSecrets:
      - name: dockerconfigjson-github-com
      containers:
      - name: nier
        image: ghcr.io/sphiria/yuisis:v1.1.7
        imagePullPolicy: Always
        resources:
          limits:
            memory: "12Gi"
            cpu: "12000m"
          requests:
            memory: "8Gi"
            cpu: "500m"
        ports:
          - containerPort: 8080
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 20"]
        volumeMounts:
          - name: nier-config-volume
            mountPath: /var/www/html/LocalSettings.php
            subPath: LocalSettings.php
          - name: nier-config-volume
            mountPath: /etc/nginx/nginx.conf
            subPath: nginx.conf
          - name: nier-config-volume
            mountPath: /etc/php84/php-fpm.d/www.conf
            subPath: php-fpm.conf
          - name: nier-assets-volume
            mountPath: /mnt/images
        env:
        - name: EMAIL
          valueFrom:
            secretKeyRef:
              name: nier-secrets
              key: email
        - name: EMAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nier-secrets
              key: email_password
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: nier-secrets
              key: db_name
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: nier-secrets
              key: db_host
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: nier-secrets
              key: db_username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nier-secrets
              key: db_password
        - name: DB_CARGO_NAME
          valueFrom:
            secretKeyRef:
              name: nier-secrets
              key: db_cargo_name
        - name: MW_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: nier-secrets
              key: mw_secret_key
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: nier-secrets
              key: redis_host
        - name: ES_HOST
          valueFrom:
            secretKeyRef:
              name: nier-secrets
              key: es_host
        - name: DISCORD_WEBHOOK
          valueFrom:
            secretKeyRef:
              name: nier-secrets
              key: discord_webhook
        - name: CLOUDFLARE_ZONE_ID
          valueFrom:
            secretKeyRef:
              name: nier-secrets
              key: cloudflare_zone_id
        - name: CLOUDFLARE_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: nier-secrets
              key: cloudflare_api_token
        - name: TURNSTILE_SITE_KEY
          valueFrom:
            secretKeyRef:
              name: nier-secrets
              key: turnstile_site_key
        - name: TURNSTILE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: nier-secrets
              key: turnstile_secret_key
      volumes:
      - name: nier-config-volume
        configMap:
          name: nier-config
      - name: nier-assets-volume
        persistentVolumeClaim:
          claimName: nier-assets-volume-claim
---
apiVersion: v1
kind: Service
metadata:
  name: nier-service
spec:
  type: ClusterIP
  ports:
  - name: http
    targetPort: 8080
    port: 8080
  selector:
    app: nier
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gbfwiki-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 15m
spec:
  ingressClassName: nginx
  rules:
    - host: gbf.wiki
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nier-service
                port:
                  number: 8080