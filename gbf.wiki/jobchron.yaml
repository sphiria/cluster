apiVersion: batch/v1
kind: CronJob
metadata:
  name: nier-jobchron
  labels:
    app: nier-jobchron
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app: nier-jobchron
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
          - name: jobchron
            image: ghcr.io/sphiria/yuisis:v1.1.10
            imagePullPolicy: Always
            command: ["php84", "-d", "memory_limit=256M", "/opt/jobchron/run.php"]
            resources:
              requests:
                memory: "64Mi"
                cpu: "50m"
              limits:
                memory: "384Mi"
                cpu: "500m"
            env:
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: nier-secrets
                  key: redis_host
