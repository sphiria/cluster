apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: ilsa-secrets
spec:
  itemPath: "vaults/sphiria/items/relinklegacy"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ilsa
  labels:
    app: nginx
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: ilsa
  replicas: 1
  template:
    metadata:
      labels:
        app: ilsa
    spec:
      imagePullSecrets:
      - name: dockerconfigjson-github-com
      containers:
      - name: ilsa
        image: ghcr.io/sphiria/yuisis:v1.1.8
        imagePullPolicy: Always
        resources:
          limits:
            memory: "8Gi"
            cpu: "2000m"
          requests:
            memory: "4Gi"
            cpu: "100m"
        ports:
          - containerPort: 8080
        volumeMounts:
          - name: ilsa-config-volume
            mountPath: /var/www/html/LocalSettings.php
            subPath: LocalSettings.php
          - name: ilsa-config-volume
            mountPath: /etc/php84/php-fpm.d/www.conf
            subPath: php-fpm.conf
          - name: ilsa-config-volume
            mountPath: /etc/nginx/nginx.conf
            subPath: nginx.conf
          - name: ilsa-jobrunner-volume
            mountPath: /etc/jobrunner/jobrunner.json
            subPath: jobrunner.json
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 20"]
        env:
        - name: EMAIL
          valueFrom:
            secretKeyRef:
              name: ilsa-secrets
              key: email
        - name: EMAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ilsa-secrets
              key: email-password
        - name: MEDIAWIKI_DB_SERVER
          valueFrom:
            secretKeyRef:
              name: ilsa-secrets
              key: db-host
        - name: MEDIAWIKI_DB_NAME
          valueFrom:
            secretKeyRef:
              name: ilsa-secrets
              key: db-name
        - name: MEDIAWIKI_DB_USER
          valueFrom:
            secretKeyRef:
              name: ilsa-secrets
              key: db-user
        - name: MEDIAWIKI_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ilsa-secrets
              key: db-password
        - name: MEDIAWIKI_SECRETKEY
          valueFrom:
            secretKeyRef:
              name: ilsa-secrets
              key: secret-key
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: ilsa-secrets
              key: redis-host
        - name: AWS_S3_KEY
          valueFrom:
            secretKeyRef:
              name: ilsa-secrets
              key: s3-key
        - name: AWS_S3_SECRET
          valueFrom:
            secretKeyRef:
              name: ilsa-secrets
              key: s3-secret
        - name: AWS_S3_TOKEN
          valueFrom:
            secretKeyRef:
              name: ilsa-secrets
              key: s3-token
        - name: CLOUDFLARE_ZONE_ID
          valueFrom:
            secretKeyRef:
              name: ilsa-secrets
              key: cf-zone-id
        - name: CLOUDFLARE_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: ilsa-secrets
              key: cf-api-token
        - name: DISCORD_WEBHOOK
          valueFrom:
            secretKeyRef:
              name: ilsa-secrets
              key: discord-webhook
      volumes:
      - name: ilsa-config-volume
        configMap:
          name: ilsa-config
      - name: ilsa-jobrunner-volume
        configMap:
          name: jobrunner-config
---
apiVersion: v1
kind: Service
metadata:
  name: ilsa-service
spec:
  type: ClusterIP
  ports:
  - name: http
    targetPort: 8080
    port: 8080
  selector:
    app: ilsa
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: relink-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 11m
    nginx.ingress.kubernetes.io/forwarded-for-header: "CF-Connecting-IP"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    nginx.ingress.kubernetes.io/compute-full-forwarded-for: "true"
    nginx.ingress.kubernetes.io/enable-real-ip: "true"
    nginx.ingress.kubernetes.io/proxy-real-ip-cidr: "10.0.0.0/8,173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
spec:
  ingressClassName: nginx
  rules:
    - host: relink.gbf.wiki
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name:  ilsa-service
                port:
                  number: 8080